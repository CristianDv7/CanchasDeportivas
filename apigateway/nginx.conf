events {
    worker_connections 1024;
}

http {
    upstream ms_usuarios  { server ms-usuarios:8000; }
    upstream ms_canchas   { server ms-canchas:8000; }
    upstream ms_reservas  { server ms-reservas:8000; }
    upstream ms_reportes  { server ms-reportes:8000; }
    upstream shell_dev    { server frontend-shell:3000; }

    server {
        listen 80;
        server_name localhost;

        # ==========================================
        # API GATEWAY → Microservicios
        # ==========================================
        location /api/usuarios/ {
            proxy_pass http://ms_usuarios/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/canchas/ {
            proxy_pass http://ms_canchas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/reservas/ {
            proxy_pass http://ms_reservas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/reportes/ {
            proxy_pass http://ms_reportes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==========================================
        # SHELL (dev server proxy)
        # ==========================================
        location / {
            proxy_pass http://shell_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSockets (HMR de Rsbuild)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}